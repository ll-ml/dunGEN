    @font-face {

        src: url('/assets/fonts/MedievalSharp/MedievalSharp-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        image-rendering: pixelated;

        background-color: black;

    #game-title {
        top: 20px;

    }

    #statusArea {
        width: 100%;

    }
    #inventory {
        position: fixed;
        top: 0;
        right: 0;
        width: 250px;
        height: 100vh;
        background-color: #f0e6d2;
        color: #4b3b2f;
        font-family: 'DungeonFont', 'Courier New', Courier, monospace;
        border-left: 2px solid #333;
        padding: 10px;
        box-sizing: border-box;
        overflow-y: auto;
    }
    #inventory h2 {
        margin-top: 0;
        text-align: center;
    }

    #ctxMenu {
        position: absolute;
        background: #222;
        border: 1px solid #555;
        padding: 4px 0;
        display: none;
        z-index: 1000;
        color: white;
        font-family: 'DungeonFont', 'Courier New', Courier, monospace;
    }

    #ctxMenu li {
        list-style: none;
        padding: 4px 16px;
        cursor: pointer;
    }

    }
